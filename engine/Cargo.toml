[package]
name="touchpilot-input"
version="1.0.1"
edition="2021"
license="GPL-3.0-only"

[workspace]

[dependencies]
serde={version="1",features=["derive"]}
serde_json="1"
windows={version="0.58",features=["Win32_Foundation", "Win32_Devices_HumanInterfaceDevice", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_Security"]}

[profile.release]
lto=true
codegen-units=1
strip=true
